[project]
name = "nexora"
version = "0.1.0"
description = "An autonomous simulated internet society powered by AI agents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=1.109.0",
    "pydantic>=2.11",
    "rich>=14.0",
    "typer>=0.27.1",
]

[project.scripts]
nexora = "nexora.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=9.0",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.14"
strict = true
